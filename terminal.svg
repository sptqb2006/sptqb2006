<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 710" width="100%" height="710" style="background: transparent;">
  <defs>
    <style>
      .term-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5px; rx: 10px; }
      .title-bar { fill: #161b22; }
      .title-text { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 500; }
      .term-text { font-family: "Fira Code", "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #c9d1d9; }
      .c-green { fill: #00ff9c; font-weight: bold; }
      .c-blue { fill: #58a6ff; font-weight: bold; }
      .c-yellow { fill: #f0883e; }
      .c-dim { fill: #6e7681; }
      .c-cyan { fill: #79c0ff; }
      .c-gold { fill: #ffd700; }
      .c-red { fill: #ff7b72; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="2" y="2" width="846" height="706" class="term-bg" />
  
  <!-- Window Titlebar -->
  <path d="M 2,12 A 10,10 0 0,1 12,2 L 838,2 A 10,10 0 0,1 848,12 L 848,36 L 2,36 Z" class="title-bar" />
  <circle cx="20" cy="19" r="6" fill="#ff5f56" />
  <circle cx="39" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="58" cy="19" r="6" fill="#27c93f" />
  <text x="425" y="23" class="title-text" text-anchor="middle">hackertit@soc-station: ~ (zsh)</text>

  <!-- [0] ASCII ART BANNER & SESSION INFO (Begins at 0.1s) -->
  <clipPath id="clip_banner">
    <rect x="25" y="48" width="800" height="0">
      <animate attributeName="height" from="0" to="170" dur="0.5s" begin="0.1s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_banner)" class="term-text">
    <text x="25" y="65" class="c-blue">    __               __             __  _ __ </text>
    <text x="25" y="81" class="c-blue">   / /_  ____ ______/ /_____  _____/ /_(_) /_</text>
    <text x="25" y="97" class="c-blue">  / __ \/ __ `/ ___/ //_/ _ \/ ___/ __/ / __/</text>
    <text x="25" y="113" class="c-blue"> / / / / /_/ / /__/ ,&lt; /  __/ /  / /_/ / /_  </text>
    <text x="25" y="129" class="c-blue">/_/ /_/\__,_/\___/_/|_|\___/_/   \__/_/\__/  </text>
    
    <text x="25" y="155" class="c-green">[+] Session: <tspan class="c-cyan">hackertit@soc-station: ~</tspan></text>
    <text x="25" y="173" class="c-green">[+] Role: <tspan class="c-cyan">SOC Analyst</tspan></text>
    <text x="25" y="191" class="c-green">[+] Location: <tspan class="c-cyan">Ha Noi, Vietnam</tspan></text>
    <text x="25" y="209" class="c-green">[+] System: <tspan class="c-cyan">Linux x86_64</tspan> | Uptime: <tspan class="c-gold">20 years</tspan></text>
  </g>

  <!-- [1] COMMAND 1: whoami (Begins at 0.8s) -->
  <clipPath id="clip_cmd1">
    <rect x="25" y="228" width="0" height="25">
      <animate attributeName="width" from="0" to="260" dur="0.5s" begin="0.7s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_cmd1)" class="term-text">
    <text x="25" y="244">
      <tspan class="c-green">hackertit@soc</tspan><tspan class="c-dim">:</tspan><tspan class="c-blue">~</tspan><tspan class="c-dim">$</tspan> whoami
    </text>
  </g>

  <!-- [1.1] OUTPUT 1: whoami output (Begins at 1.3s) -->
  <clipPath id="clip_out1">
    <rect x="25" y="252" width="800" height="0">
      <animate attributeName="height" from="0" to="110" dur="0.4s" begin="1.3s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_out1)" class="term-text">
    <text x="40" y="268"><tspan class="c-dim">Name:      </tspan><tspan class="c-cyan">hackertit</tspan></text>
    <text x="40" y="286"><tspan class="c-dim">Role:      </tspan><tspan class="c-cyan">SOC Analyst</tspan></text>
    <text x="40" y="304"><tspan class="c-dim">Location:  </tspan><tspan class="c-cyan">Ha Noi</tspan></text>
    <text x="40" y="322"><tspan class="c-dim">Education: </tspan><tspan class="c-cyan">B.S. in Cyber Security, USTH</tspan></text>
    <text x="40" y="340"><tspan class="c-dim">Focus:     </tspan><tspan class="c-cyan">SOC Alert Triage, Incident Response, DFIR, SIEM, Reverse Eng &amp; CTF</tspan></text>
  </g>

  <!-- [2] COMMAND 2: cat skills.txt (Begins at 1.9s) -->
  <clipPath id="clip_cmd2">
    <rect x="25" y="358" width="0" height="25">
      <animate attributeName="width" from="0" to="280" dur="0.6s" begin="1.9s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_cmd2)" class="term-text">
    <text x="25" y="374">
      <tspan class="c-green">hackertit@soc</tspan><tspan class="c-dim">:</tspan><tspan class="c-blue">~</tspan><tspan class="c-dim">$</tspan> cat skills.txt
    </text>
  </g>

  <!-- [2.1] OUTPUT 2: skills.txt output (Begins at 2.6s) -->
  <clipPath id="clip_out2">
    <rect x="25" y="382" width="800" height="0">
      <animate attributeName="height" from="0" to="95" dur="0.4s" begin="2.6s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_out2)" class="term-text">
    <text x="40" y="398"><tspan class="c-yellow">SOC &amp; DFIR:   </tspan>Alert Triage, Traffic Analysis, Wireshark, Nmap, Burp Suite</text>
    <text x="40" y="416"><tspan class="c-yellow">RE &amp; Binary:  </tspan>Ghidra, IDA Pro, GDB, Malware Behavior Analysis</text>
    <text x="40" y="434"><tspan class="c-yellow">Dev &amp; Infra:  </tspan>Python, C/C++, Linux, Docker, Hardened FastAPI</text>
    <text x="40" y="452"><tspan class="c-yellow">Automation:   </tspan>Custom MCP Servers, Automation Scripts with Python &amp; LLMs</text>
  </g>

  <!-- [3] COMMAND 3: cat achievements.txt (Begins at 3.2s) -->
  <clipPath id="clip_cmd3">
    <rect x="25" y="470" width="0" height="25">
      <animate attributeName="width" from="0" to="340" dur="0.6s" begin="3.2s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_cmd3)" class="term-text">
    <text x="25" y="486">
      <tspan class="c-green">hackertit@soc</tspan><tspan class="c-dim">:</tspan><tspan class="c-blue">~</tspan><tspan class="c-dim">$</tspan> cat achievements.txt
    </text>
  </g>

  <!-- [3.1] OUTPUT 3: achievements.txt output (Begins at 3.9s) -->
  <clipPath id="clip_out3">
    <rect x="25" y="494" width="800" height="0">
      <animate attributeName="height" from="0" to="95" dur="0.4s" begin="3.9s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_out3)" class="term-text">
    <text x="40" y="510"><tspan class="c-gold">[*] </tspan>Top 12 CTFtime Vietnam – Team USTH_Ex0dia</text>
    <text x="40" y="528"><tspan class="c-red">[*] </tspan>MTA CTF 2026 – "Most First Bloods" Award</text>
    <text x="40" y="546"><tspan class="c-gold">[*] </tspan>Digital Dragons 2026 – Top 4 (Consolation Prize)</text>
    <text x="40" y="564"><tspan class="c-gold">[*] </tspan>Cybersecurity Student Contest Vietnam 2026 – Top 4 Finals (3rd Prize)</text>
  </g>

  <!-- [4] COMMAND 4: git-stats -commits -streak (Begins at 4.5s) -->
  <clipPath id="clip_cmd4">
    <rect x="25" y="582" width="0" height="25">
      <animate attributeName="width" from="0" to="380" dur="0.6s" begin="4.5s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_cmd4)" class="term-text">
    <text x="25" y="598">
      <tspan class="c-green">hackertit@soc</tspan><tspan class="c-dim">:</tspan><tspan class="c-blue">~</tspan><tspan class="c-dim">$</tspan> git-stats --commits --streak
    </text>
  </g>

  <!-- [4.1] OUTPUT 4: Telemetry status (Begins at 5.2s) -->
  <clipPath id="clip_out4">
    <rect x="25" y="606" width="800" height="0">
      <animate attributeName="height" from="0" to="30" dur="0.3s" begin="5.2s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_out4)" class="term-text">
    <text x="40" y="622" class="c-dim">[✓] Telemetry loaded. Live commit metrics rendered below:</text>
  </g>

  <!-- [5] ACTIVE PROMPT WITH BLINKING CURSOR (Begins at 5.6s) -->
  <g class="term-text">
    <text x="25" y="660">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="5.6s" fill="freeze" />
      <tspan class="c-green">hackertit@soc</tspan><tspan class="c-dim">:</tspan><tspan class="c-blue">~</tspan><tspan class="c-dim">$</tspan> 
    </text>
    <!-- Blinking Cursor -->
    <rect x="180" y="647" width="8" height="15" fill="#00ff9c">
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="1s" repeatCount="indefinite" begin="5.6s" />
    </rect>
  </g>

</svg>