<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" width="100%" height="760" style="background: transparent;">
  <defs>
    <style><![CDATA[
      .term-bg { fill: #0a0e17; stroke: #1e293b; stroke-width: 1.5px; rx: 10px; }
      .term-glow { stroke: #2563eb; stroke-width: 1px; stroke-opacity: 0.35; fill: none; rx: 10px; }
      .title-bar { fill: #0f172a; }
      .title-text { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; font-size: 12px; font-weight: 600; }
      .term-text { font-family: "Fira Code", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #cbd5e1; }
      
      /* Kali Prompt Colors */
      .k-bracket { fill: #3b82f6; font-weight: bold; }
      .k-user { fill: #00f2fe; font-weight: bold; }
      .k-sigil { fill: #ff0055; font-weight: bold; }
      .k-host { fill: #3b82f6; font-weight: bold; }
      .k-path { fill: #fbbf24; }
      .k-symbol { fill: #3b82f6; font-weight: bold; }
      .k-cmd { fill: #00ff9c; font-weight: bold; }
      
      /* Info & Highlights */
      .c-blue { fill: #38bdf8; font-family: monospace; font-weight: bold; font-size: 11.5px; }
      .c-green { fill: #00ff9c; }
      .c-cyan { fill: #38bdf8; }
      .c-dim { fill: #64748b; }
      .c-amber { fill: #f59e0b; }
      .c-red { fill: #ef4444; }
      .c-white { fill: #f8fafc; }
    ]]></style>
  </defs>

  <!-- Terminal Window Shadow & Background -->
  <rect x="2" y="2" width="856" height="756" class="term-bg" />
  <rect x="3" y="3" width="854" height="754" class="term-glow" />
  
  <!-- Title bar -->
  <path d="M 2,12 A 10,10 0 0,1 12,2 L 848,2 A 10,10 0 0,1 858,12 L 858,35 L 2,35 Z" class="title-bar" />
  <circle cx="20" cy="18.5" r="5.5" fill="#ef4444" />
  <circle cx="38" cy="18.5" r="5.5" fill="#f59e0b" />
  <circle cx="56" cy="18.5" r="5.5" fill="#10b981" />
  <text x="430" y="22.5" class="title-text" text-anchor="middle">qterminal - hackertit@kali: ~ (zsh)</text>

  <!-- [HEADER] ASCII ART & SYSTEM INFO (0.2s - 0.8s) -->
  <clipPath id="clip_hdr">
    <rect x="25" y="45" width="810" height="0">
      <animate attributeName="height" from="0" to="170" dur="0.6s" begin="0.2s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_hdr)" class="term-text">
    <text x="25" y="62" class="c-blue">    __               __             __  _ __ </text>
    <text x="25" y="77" class="c-blue">   / /_  ____ ______/ /_____  _____/ /_(_) /_</text>
    <text x="25" y="92" class="c-blue">  / __ \/ __ `/ ___/ //_/ _ \/ ___/ __/ / __/</text>
    <text x="25" y="107" class="c-blue"> / / / / /_/ / /__/ ,&lt; /  __/ /  / /_/ / /_  </text>
    <text x="25" y="122" class="c-blue">/_/ /_/\__,_/\___/_/|_|\___/_/   \__/_/\__/  </text>
    
    <text x="25" y="146"><tspan class="c-dim">┌──[</tspan><tspan class="c-cyan">SYSTEM TELEMETRY</tspan><tspan class="c-dim">]</tspan></text>
    <text x="25" y="164"><tspan class="c-dim">├──</tspan> <tspan class="c-dim">OS:       </tspan><tspan class="c-white">Kali GNU/Linux Rolling x86_64</tspan></text>
    <text x="25" y="182"><tspan class="c-dim">├──</tspan> <tspan class="c-dim">Host:     </tspan><tspan class="c-white">SOC-Security-Station</tspan> | <tspan class="c-dim">Role: </tspan><tspan class="c-green">SOC Analyst</tspan></text>
    <text x="25" y="200"><tspan class="c-dim">└──</tspan> <tspan class="c-dim">Location: </tspan><tspan class="c-white">Ha Noi, Vietnam</tspan> | Uptime: <tspan class="c-amber">20 years</tspan></text>
  </g>

  <!-- [SECTION 1] PROMPT 1: whoami (Slow typing 1.5s - 3.2s) -->
  <g class="term-text">
    <text x="25" y="235">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.3s" fill="freeze" />
      <tspan class="k-bracket">┌──(</tspan><tspan class="k-user">hackertit</tspan><tspan class="k-sigil">㉿</tspan><tspan class="k-host">kali</tspan><tspan class="k-bracket">)-[</tspan><tspan class="k-path">~</tspan><tspan class="k-bracket">]</tspan>
    </text>
    <text x="25" y="255">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.5s" fill="freeze" />
      <tspan class="k-symbol">└─$ </tspan>
    </text>
  </g>

  <clipPath id="clip_cmd1">
    <rect x="62" y="240" width="0" height="22">
      <animate attributeName="width" from="0" to="120" dur="1.4s" begin="1.8s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_cmd1)" class="term-text">
    <text x="62" y="255" class="k-cmd">whoami</text>
  </g>

  <!-- Output 1 (Reveal 3.4s - 4.8s) -->
  <clipPath id="clip_out1">
    <rect x="25" y="265" width="810" height="0">
      <animate attributeName="height" from="0" to="105" dur="0.6s" begin="3.4s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_out1)" class="term-text">
    <text x="40" y="280"><tspan class="c-dim">Name:      </tspan><tspan class="c-cyan">hackertit</tspan></text>
    <text x="40" y="298"><tspan class="c-dim">Role:      </tspan><tspan class="c-green">SOC Analyst</tspan></text>
    <text x="40" y="316"><tspan class="c-dim">Location:  </tspan><tspan class="c-white">Ha Noi</tspan></text>
    <text x="40" y="334"><tspan class="c-dim">Education: </tspan><tspan class="c-white">B.S. in Cyber Security, USTH</tspan></text>
    <text x="40" y="352"><tspan class="c-dim">Focus:     </tspan><tspan class="c-cyan">SOC Alert Triage, Incident Response, DFIR, SIEM, Reverse Eng &amp; CTF</tspan></text>
  </g>


  <!-- [SECTION 2] PROMPT 2: cat skills.txt (Slow typing 4.8s - 7.0s) -->
  <g class="term-text">
    <text x="25" y="385">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="4.5s" fill="freeze" />
      <tspan class="k-bracket">┌──(</tspan><tspan class="k-user">hackertit</tspan><tspan class="k-sigil">㉿</tspan><tspan class="k-host">kali</tspan><tspan class="k-bracket">)-[</tspan><tspan class="k-path">~</tspan><tspan class="k-bracket">]</tspan>
    </text>
    <text x="25" y="405">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="4.7s" fill="freeze" />
      <tspan class="k-symbol">└─$ </tspan>
    </text>
  </g>

  <clipPath id="clip_cmd2">
    <rect x="62" y="390" width="0" height="22">
      <animate attributeName="width" from="0" to="190" dur="1.6s" begin="5.0s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_cmd2)" class="term-text">
    <text x="62" y="405" class="k-cmd">cat skills.txt</text>
  </g>

  <!-- Output 2 (Reveal 6.8s - 8.2s) -->
  <clipPath id="clip_out2">
    <rect x="25" y="415" width="810" height="0">
      <animate attributeName="height" from="0" to="95" dur="0.6s" begin="6.8s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_out2)" class="term-text">
    <text x="40" y="430"><tspan class="c-amber">SOC &amp; DFIR:   </tspan><tspan class="c-white">Alert Triage, Traffic Analysis, Wireshark, Nmap, Burp Suite</tspan></text>
    <text x="40" y="448"><tspan class="c-amber">RE &amp; Binary:  </tspan><tspan class="c-white">Ghidra, IDA Pro, GDB, Malware Behavior Analysis</tspan></text>
    <text x="40" y="466"><tspan class="c-amber">Dev &amp; Infra:  </tspan><tspan class="c-white">Python, C/C++, Linux, Docker, Hardened FastAPI</tspan></text>
    <text x="40" y="484"><tspan class="c-amber">Automation:   </tspan><tspan class="c-white">Custom MCP Servers, Security Automation with Python &amp; LLMs</tspan></text>
  </g>


  <!-- [SECTION 3] PROMPT 3: cat achievements.txt (Slow typing 8.5s - 11.2s) -->
  <g class="term-text">
    <text x="25" y="520">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="8.2s" fill="freeze" />
      <tspan class="k-bracket">┌──(</tspan><tspan class="k-user">hackertit</tspan><tspan class="k-sigil">㉿</tspan><tspan class="k-host">kali</tspan><tspan class="k-bracket">)-[</tspan><tspan class="k-path">~</tspan><tspan class="k-bracket">]</tspan>
    </text>
    <text x="25" y="540">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="8.4s" fill="freeze" />
      <tspan class="k-symbol">└─$ </tspan>
    </text>
  </g>

  <clipPath id="clip_cmd3">
    <rect x="62" y="525" width="0" height="22">
      <animate attributeName="width" from="0" to="240" dur="1.8s" begin="8.7s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_cmd3)" class="term-text">
    <text x="62" y="540" class="k-cmd">cat achievements.txt</text>
  </g>

  <!-- Output 3 (Reveal 10.8s - 12.2s) -->
  <clipPath id="clip_out3">
    <rect x="25" y="550" width="810" height="0">
      <animate attributeName="height" from="0" to="95" dur="0.6s" begin="10.8s" fill="freeze" />
    </rect>
  </clipPath>
  <g clip-path="url(#clip_out3)" class="term-text">
    <text x="40" y="565"><tspan class="c-amber">[*] </tspan><tspan class="c-white">Top 12 CTFtime Vietnam – Team USTH_Ex0dia</tspan></text>
    <text x="40" y="583"><tspan class="c-red">[*] </tspan><tspan class="c-white">MTA CTF 2026 – "Most First Bloods" Award</tspan></text>
    <text x="40" y="601"><tspan class="c-amber">[*] </tspan><tspan class="c-white">Digital Dragons 2026 – Top 4 (Consolation Prize)</tspan></text>
    <text x="40" y="619"><tspan class="c-amber">[*] </tspan><tspan class="c-white">Cybersecurity Student Contest Vietnam 2026 – Top 4 Finals (3rd Prize)</tspan></text>
  </g>


  <!-- [SECTION 4] ACTIVE FINAL PROMPT WITH BLINKING CURSOR (Begins at 12.2s) -->
  <g class="term-text">
    <text x="25" y="655">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="12.0s" fill="freeze" />
      <tspan class="k-bracket">┌──(</tspan><tspan class="k-user">hackertit</tspan><tspan class="k-sigil">㉿</tspan><tspan class="k-host">kali</tspan><tspan class="k-bracket">)-[</tspan><tspan class="k-path">~</tspan><tspan class="k-bracket">]</tspan>
    </text>
    <text x="25" y="675">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="12.2s" fill="freeze" />
      <tspan class="k-symbol">└─$ </tspan>
    </text>
    <!-- Blinking Terminal Cursor -->
    <rect x="62" y="662" width="9" height="15" fill="#00ff9c">
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="1.1s" repeatCount="indefinite" begin="12.3s" />
    </rect>
  </g>

</svg>