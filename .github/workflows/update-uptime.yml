name: Auto Update Uptime

on:
  schedule:
    # Chạy tự động vào ngày 1 hàng tháng và sau tháng 5 hàng năm
    - cron: '0 0 1 * *'
    - cron: '0 0 15 5 *'
  workflow_dispatch:

jobs:
  update-uptime:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate and Update Uptime
        env:
          START_DATE: ${{ secrets.START_DATE }}
        run: |
          python3 -c "
          import os, re
          from datetime import date

          start_env = os.environ.get('START_DATE', '').strip()
          if not start_env:
              print('START_DATE secret is not set. Skipping uptime update.')
              exit(0)

          try:
              y, m, d = [int(x) for x in start_env.split('-')]
              today = date.today()
              uptime_years = today.year - y - ((today.month, today.day) < (m, d))

              with open('README.md', 'r', encoding='utf-8') as f:
                  content = f.read()

              new_content = re.sub(r'Uptime:\s*\d+\s*years', f'Uptime: {uptime_years} years', content)

              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_content)
          except Exception as e:
              print(f'Error calculating uptime: {e}')
              exit(1)
          "

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(profile): auto-update system uptime"
            git push
          else
            echo "Uptime is already up to date. No changes to commit."
          fi
